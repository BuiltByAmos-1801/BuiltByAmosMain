name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate CNAME before build
        shell: bash
        run: |
          set -euo pipefail
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "builtbyamos.in"
          test -f public/CNAME
          test "$(tr -d '\r\n' < public/CNAME)" = "builtbyamos.in"
          echo "Root and public CNAME files are present and correct."

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp CNAME dist/CNAME
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/CNAME
          test "$(tr -d '\r\n' < dist/CNAME)" = "builtbyamos.in"
          echo "Dist artifact contains CNAME:"
          cat dist/CNAME
          echo "Dist artifact contains .nojekyll:"
          ls -la dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
