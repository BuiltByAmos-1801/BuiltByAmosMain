<!doctype html>
<html lang="en-IN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />
    <title>Thank You | Built By Amos</title>
    <meta name="description" content="Thank you for contacting Built By Amos. We will get back to you soon." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: "#0B0B0B", smoke: "#A3A3A3", line: "rgba(255,255,255,0.12)" },
            fontFamily: { sans: ["Poppins", "Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
            boxShadow: { glow: "0 0 48px rgba(255,255,255,0.12)" },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body class="noise min-h-screen overflow-x-hidden bg-ink font-sans text-white antialiased">
    <header class="sticky inset-x-0 top-0 z-30 border-b border-line bg-gradient-to-r from-ink/90 via-ink/80 to-ink/95 backdrop-blur-xl shadow-xl">
      <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 sm:px-8">
        <a href="./index.html" class="flex items-center gap-3 text-sm font-black uppercase tracking-[0.18em] text-white">
          <img src="./images/builtbyamos-logo.svg" alt="Built By Amos" class="h-9 w-auto" />
          <span class="hidden sm:inline">Built By Amos</span>
        </a>
        <div class="hidden items-center gap-8 text-sm text-white/80 md:flex">
          <a class="hover:text-white" href="./index.html">Home</a>
          <a class="hover:text-white" href="./services.html">Services</a>
          <a class="hover:text-white" href="./portfolio.html">Portfolio</a>
          <a class="hover:text-white" href="./pricing.html">Pricing</a>
          <a class="hover:text-white" href="./contact.html">Contact</a>
        </div>
      </nav>
    </header>

    <main class="px-5 py-24 sm:px-8 lg:py-32">
      <section class="mx-auto flex max-w-5xl items-center justify-center">
        <div class="w-full rounded-3xl border border-line bg-white/[0.03] p-8 shadow-2xl sm:p-12 lg:p-16">
          <p class="text-sm font-semibold uppercase tracking-[0.32em] text-white/50">Thank You</p>
          <h1 class="mt-4 text-4xl font-black uppercase leading-tight sm:text-5xl">Your inquiry has been received.</h1>
          <p class="mt-6 text-lg leading-8 text-white/65" id="thankYouMessage">
            Thanks for reaching out to Built By Amos. We have received your message and will get back to you shortly.
          </p>
          <div class="mt-8 flex flex-wrap gap-4">
            <a href="./index.html" class="rounded-full bg-white px-6 py-3 text-sm font-semibold uppercase tracking-[0.16em] text-ink transition hover:scale-[1.02]">Back to Home</a>
            <a href="./contact.html" class="rounded-full border border-white/25 px-6 py-3 text-sm font-semibold uppercase tracking-[0.16em] text-white transition hover:bg-white hover:text-ink">Contact Again</a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name");
      const message = document.getElementById("thankYouMessage");
      if (message && name) {
        message.innerHTML = `Thanks <strong>${name}</strong> for reaching out to Built By Amos. We have received your message and will get back to you shortly.`;
      }
    </script>
  </body>
</html>
